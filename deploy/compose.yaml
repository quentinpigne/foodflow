# Environnement unique de Foodflow, sur le serveur (ADR-0009, comme Cashflow).
# Déploiement : deploy/deploy.sh (cf. deploy/README.md).
name: foodflow

services:
  foodflow:
    # Chaque image est étiquetée par son commit, pour pouvoir revenir à la précédente.
    image: foodflow:${FOODFLOW_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # Réseau local seulement : rien n'est exposé sur Internet. HTTPS à venir (ADR-0009, Q16).
    ports:
      - ${FOODFLOW_PORT:-3100}:3100
    environment:
      TZ: ${TZ:-Europe/Paris}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - data:/data

volumes:
  # Tout l'état : foodflow.db, backups/, images/.
  data:
